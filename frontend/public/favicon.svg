<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="mgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Rounded Shield / Square Container -->
  <rect x="6" y="6" width="88" height="88" rx="24" fill="url(#mgGrad)" filter="url(#shadow)" stroke="#FFF" stroke-width="2" stroke-opacity="0.2"/>
  
  <!-- Monogram MG -->
  <text x="50%" y="54%" text-anchor="middle" dominant-baseline="middle" 
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="44" font-weight="900" fill="#0A0B0E" letter-spacing="-2">
    MG
  </text>
  
  <!-- Subtle Top Accent Crown / Star dot -->
  <circle cx="50" cy="20" r="3" fill="#0A0B0E" opacity="0.8"/>
</svg>